      const fileName = 'anysound_26.19.6 beta 8.apk';

      function triggerDownload() {

        if (!modal) return;
        lastFocusedElement = document.activeElement;
        modal.classList.add('active');
        document.body.style.overflow = 'hidden';
        
        // 聚焦关闭按钮或第一个链接，提升可访问性

          lastFocusedElement.focus();
        }

      if (showBtn) {

      if (closeBtn) {
